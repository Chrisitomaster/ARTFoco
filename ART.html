<style>

#app{max-width:640px;margin:0 auto;padding:12px 12px 24px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px 12px}

header.top .sub{font-size:11px;color:var(--txt2);font-weight:500}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--txt2);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:6px}
.btn.wide{width:100%}
.btn.danger{background:var(--no)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--txt2)}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--txt2)}
input[type=text],input[type=date],textarea,select{

.count{font-size:11px;color:var(--txt2);text-align:right;margin-top:2px}
.count.over{color:var(--no);font-weight:700}

.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);

.chip.pel{padding:4px 9px;font-size:12px;margin:0 4px 4px 0}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.part{background:transparent;border-color:var(--acc);color:var(--acc2)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);

.tabs button{flex:1;background:none;border:0;color:var(--txt2);padding:9px 2px 11px;font-size:11px;cursor:pointer;font-weight:600}
.tabs button .ic{display:block;font-size:18px;line-height:1.2}
.tabs button.on{color:var(--acc2)}
.steps{display:flex;gap:6px;margin:2px 0 10px}
.steps div{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps div.on{background:var(--acc)}
.muted{color:var(--txt2);font-size:13px}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:12px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg2)}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12px;color:var(--txt2);margin-top:3px}
.tri{display:flex;gap:4px}
.tri button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--txt2);

.tri button.no.on{background:var(--no);border-color:var(--no);color:#fff}
.tri button.na.on{background:var(--na);border-color:var(--na);color:#fff}

.copybox .lbl .grow{color:var(--acc2)}
.copybox .val{padding:10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.copybox.done{border-color:var(--ok)}

/* ---------- 4. HELPERS ---------- */

function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k==="html") e.innerHTML=v;
    else if(k==="style") e.setAttribute("style",v);
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{ if(k===null||k===undefined||k===false) return;
    e.appendChild(typeof k==="object"?k:document.createTextNode(String(k))); });
  return e;
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600);
}
function copy(txt, cb){
  const done=()=>{ toast("Copiado"); if(cb) cb(); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Copia manual"); }
    document.body.removeChild(ta);
  }
}

/* ---------- 5. MOTOR: cuadrilla -> labores -> etapas / RCO / checklist ---------- */

function nuevoDraft(){
  return {
    fecha: hoy(),
    trabajo: "", area: "",
    proc:true, instr:true, gestion:false,
    proceso: "",
    charla: "si", tema: "",
    presentes: {},            // personaId -> [laborId activas hoy]
    excluidas: [],            // ids de labor auto quitadas a mano
    manuales: [],             // etapas escritas a mano {id,nombre,peligros:[]}
    orden: [],                // ids en el orden elegido
    rcoOv: {},                // n -> "si"/"no"
    clOv: {},                 // i -> {v, obs}
    pelOv: {}                 // laborId -> [peligros] override
  };
}
function D(){ if(!DB.draft) DB.draft = nuevoDraft(); return DB.draft; }

// Labores activas = base + las marcadas por cada persona presente.
function laboresActivas(d){
  const set=new Set();
  DB.labores.filter(l=>l.base).forEach(l=>set.add(l.id));
  Object.keys(d.presentes).forEach(pid=>{
    (d.presentes[pid]||[]).forEach(lid=>set.add(lid));
  });
  (d.excluidas||[]).forEach(id=>set.delete(id));
  return [...set].map(lab).filter(Boolean).sort((a,b)=>(a.orden||50)-(b.orden||50));
}
// Etapas finales = labores activas + etapas manuales, en el orden guardado.
function etapas(d){
  let list = laboresActivas(d).map(l=>({
    id:l.id, nombre:l.nombre,
    peligros:(d.pelOv[l.id] || l.peligros || []).slice().sort((a,b)=>a-b),
    manual:false
  }));
  (d.manuales||[]).forEach(m=>list.push({
    id:m.id, nombre:m.nombre,
    peligros:(d.pelOv[m.id] || m.peligros || []).slice().sort((a,b)=>a-b),
    manual:true
  }));
  if(d.orden && d.orden.length){
    const pos = id => { const i=d.orden.indexOf(id); return i<0?999:i; };
    list.sort((a,b)=>pos(a.id)-pos(b.id));
  }
  return list;
}
function personasPresentes(d){
  return DB.personas.filter(p=>d.presentes[p.id]);
}
// RCO: los que activa cada peligro presente, más overrides manuales.
function rcoCalc(d){
  const on=new Set();
  etapas(d).forEach(e=>e.peligros.forEach(n=>{
    (PELIGRO_RCO[n]||[]).forEach(r=>on.add(r));
  }));
  const out={};
  for(let i=1;i<=19;i++) out[i] = on.has(i)?"si":"no";
  Object.keys(d.rcoOv).forEach(k=>out[k]=d.rcoOv[k]);
  return out;
}
// Checklist: base -> override por labor (si gana) -> override manual.
function checkCalc(d){
  const out={};
  CHECKLIST.forEach(c=>out[c.i]={v:CHECK_BASE[c.i]||"na", obs:CHECK_OBS_BASE[c.i]||""});
  laboresActivas(d).forEach(l=>{
    Object.keys(l.check||{}).forEach(k=>{
      if(l.check[k]==="si") out[k].v="si";
      else if(out[k].v!=="si") out[k].v=l.check[k];
    });
    // Las observaciones de cada labor se suman ítem por ítem, sin repetir.
    Object.keys(l.checkObs||{}).forEach(k=>{
      if(!l.checkObs[k]) return;
      const ya=out[k].obs?out[k].obs.split(",").map(s=>s.trim()):[];
      l.checkObs[k].split(",").map(s=>s.trim()).filter(Boolean).forEach(s=>{
        if(!ya.some(x=>x.toLowerCase()===s.toLowerCase())) ya.push(s);
      });
      out[k].obs=ya.join(", ");
    });
  });
  Object.keys(d.clOv).forEach(k=>{
    if(d.clOv[k].v!==undefined) out[k].v=d.clOv[k].v;
    if(d.clOv[k].obs!==undefined) out[k].obs=d.clOv[k].obs;
  });
  return out;
}
// Texto de la columna "Medidas de control operacional", formato idéntico al impreso.
function medidasTxt(nums){
  return nums.map(n=>{
    const p=pel(n); if(!p) return "";
    return p.medidas.map(m=>`${pad2(n)}.${m}`).join(",");
  }).filter(Boolean).join(",");
}
function peligrosTxt(nums){
  return nums.map(n=>{ const p=pel(n); return p?`${pad2(n)}.${p.nombre}`:""; })
             .filter(Boolean).join(", ");
}
function trabajoAuto(d){
  const l=laboresActivas(d).filter(x=>!x.base);
  if(!l.length) return "";
  return l.map(x=>x.nombre.split(",")[0].split(":")[0].trim().toLowerCase()).join(", ");
}

/* ---------- 6. GENERACIÓN DE SALIDA ---------- */

// Lista de campos en el ORDEN EXACTO del formulario de Foco Prevención.
function campos(d){
  const c=[], et=etapas(d), rc=rcoCalc(d), ck=checkCalc(d);
  c.push({l:"Trabajo a realizar", v:d.trabajo||trabajoAuto(d), max:100});
  c.push({l:"Área de trabajo", v:d.area, max:100});
  const def=[d.proc&&"Procedimiento",d.instr&&"Instructivo",d.gestion&&"Gestión del cambio"].filter(Boolean);
  c.push({l:"El trabajo o actividad está definida por", v:def.join(" + ")||"(ninguno)", nocopy:true});
  c.push({l:"Indicar nombre del proceso o instructivo", v:d.proceso, max:100});
  c.push({l:"Charla de seguridad", v:d.charla==="si"?"Sí":"No", nocopy:true});
  if(d.charla==="si") c.push({l:"Indicar tema a tratar", v:d.tema, max:100});
  CHECKLIST.forEach(q=>{
    const a=ck[q.i];
    c.push({l:`Etapa previa ${q.i} — ${q.corto}`,
            v:(a.v==="si"?"SÍ":a.v==="no"?"NO":"N/A") + (a.obs?"  ·  "+a.obs:""),
            copiar:a.obs, nocopy:!a.obs, sec:"previas"});
  });
  et.slice(0,13).forEach((e,i)=>{
    c.push({l:`${i+1}.Etapas de desarrollo del trabajo`, v:e.nombre, max:100, sec:"art"});
    c.push({l:`${i+1}.Descripción — peligros`, v:peligrosTxt(e.peligros), sec:"art"});
    c.push({l:`${i+1}.Descripción — medidas de control`, v:medidasTxt(e.peligros), sec:"art"});
  });
  for(let i=1;i<=19;i++)
    c.push({l:`RCO N°${i} ${RCOS[i-1]}`, v:rc[i]==="si"?"SÍ":"No", nocopy:true, sec:"rco"});
  const pp=personasPresentes(d);
  c.push({l:`Participantes (${pp.length})`,
          v:pp.map(p=>`${p.rut} - ${p.nombre} (${p.cargo})`).join("\n"), sec:"firmas"});
  return c;
}

function textoCompleto(d){
  const et=etapas(d), rc=rcoCalc(d), ck=checkCalc(d), L=[];
  L.push("ART — ANÁLISIS DE RIESGOS DE LA TAREA");
  L.push("Fecha: "+fechaCL(d.fecha));
  L.push("");
  L.push("TRABAJO O ACTIVIDAD A REALIZAR: "+(d.trabajo||trabajoAuto(d)));
  L.push("ÁREA DE TRABAJO: "+d.area);
  const def=[d.proc&&"Procedimiento",d.instr&&"Instructivo",d.gestion&&"Gestión del cambio"].filter(Boolean);
  L.push("DEFINIDA POR: "+(def.join(" + ")||"—"));
  L.push("PROCEDIMIENTO O INSTRUCTIVO: "+d.proceso);
  L.push("CHARLA DE SEGURIDAD: "+(d.charla==="si"?"SÍ":"NO")+(d.charla==="si"?("  |  TEMA: "+d.tema):""));
  L.push("");
  L.push("── ETAPAS PREVIAS DEL TRABAJO ──");
  CHECKLIST.forEach(q=>{
    const a=ck[q.i];
    L.push(`${q.i}. ${q.corto}: ${a.v==="si"?"SÍ":a.v==="no"?"NO":"N/A"}${a.obs?"  — "+a.obs:""}`);
  });
  L.push("");
  L.push("── ETAPAS DE DESARROLLO DEL TRABAJO ──");
  et.slice(0,13).forEach((e,i)=>{
    L.push("");
    L.push(`${i+1}. ${e.nombre}`);
    L.push("   PELIGROS: "+peligrosTxt(e.peligros));
    L.push("   MEDIDAS: "+medidasTxt(e.peligros));
  });
  L.push("");
  L.push("── RIESGOS CRÍTICOS (RCO) ──");
  const si=[]; for(let i=1;i<=19;i++) if(rc[i]==="si") si.push(`N°${i} ${RCOS[i-1]}`);
  L.push("SÍ: "+(si.join(" | ")||"ninguno"));
  L.push("Todos los demás: No");
  L.push("");
  L.push("── PARTICIPANTES ──");
  personasPresentes(d).forEach(p=>L.push(`${p.rut} - ${p.nombre} — ${p.cargo}`));
  return L.join("\n");
}

const app=()=>document.getElementById("app");
function render(){

  document.getElementById("ttl").textContent =

  renderTabs();
  window.scrollTo(0,0);
}
function renderTabs(){
  const t=document.getElementById("tabs"); t.innerHTML="";
  [["art","📋","ART"],["personas","👷","Personal"],["labores","🧰","Labores"],
   ["peligros","⚠️","Peligros"],["hist","🕘","Historial"]].forEach(([k,ic,lb])=>{

function campoTexto(c,label,val,max,onSet,hint){
  c.appendChild(h("label",{class:"f",text:label}));
  const inp=h("input",{type:"text",value:val||"",placeholder:"Ingrese texto...",
    onBlur:e=>{onSet(e.target.value); cnt.textContent=e.target.value.length+"/"+max;
               cnt.className="count"+(e.target.value.length>max?" over":"");},
    onInput:e=>{cnt.textContent=e.target.value.length+"/"+max;
                cnt.className="count"+(e.target.value.length>max?" over":"");}});
  c.appendChild(inp);
  const cnt=h("div",{class:"count"+((val||"").length>max?" over":""),text:(val||"").length+"/"+max});
  c.appendChild(cnt);
  if(hint) c.appendChild(h("div",{class:"muted small",text:hint}));
}

function pasoCuadrilla(a,d){
  const c=h("div",{class:"card"});
  c.appendChild(h("h3",{text:"Paso 2 · ¿Quién trabaja hoy?"}));
  c.appendChild(h("div",{class:"muted small",
    text:"Toca a las personas presentes. Debajo aparecen sus labores: las principales vienen marcadas, las parciales las activas solo si hoy las hacen."}));

  const acts=h("div",{class:"row wrap",style:"margin-top:10px"});
  acts.appendChild(h("button",{class:"btn sec sm",onClick:()=>{
    DB.personas.filter(p=>p.activo).forEach(p=>{ if(!d.presentes[p.id]) d.presentes[p.id]=p.principales.slice(); });
    save();render();}},"Marcar todos"));
  acts.appendChild(h("button",{class:"btn ghost sm",onClick:()=>{d.presentes={};save();render();}},"Limpiar"));
  const ult=DB.arts[0];
  if(ult) acts.appendChild(h("button",{class:"btn ghost sm",onClick:()=>{
    d.presentes=JSON.parse(JSON.stringify(ult.draft.presentes));save();render();}},"Misma cuadrilla que la última"));
  c.appendChild(acts);
  a.appendChild(c);

  DB.personas.filter(p=>p.activo).forEach(p=>{
    const on = !!d.presentes[p.id];
    const it=h("div",{class:"item",style:on?"border-color:var(--acc)":""});
    it.appendChild(h("div",{class:"row",onClick:()=>{
      if(on) delete d.presentes[p.id]; else d.presentes[p.id]=p.principales.slice();
      save();render();}},
      h("button",{type:"button",class:"chip"+(on?" on":""),style:"margin:0"}, on?"✓":"○"),
      h("div",{class:"grow"}, h("div",{class:"t",text:p.nombre}),
        h("div",{class:"s",text:p.cargo+" · "+p.rut}))));
    if(on){
      const sel=d.presentes[p.id];
      const lw=h("div",{class:"row wrap",style:"margin-top:8px"});
      [...new Set([...p.principales,...p.parciales])].forEach(lid=>{
        const l=lab(lid); if(!l) return;
        const act=sel.includes(lid), parcial=p.parciales.includes(lid)&&!p.principales.includes(lid);
        lw.appendChild(h("button",{type:"button",class:"chip"+(act?" on":parcial?" part":""),onClick:ev=>{
          ev.stopPropagation();
          const i=sel.indexOf(lid); if(i<0) sel.push(lid); else sel.splice(i,1);
          save();render();}},
          (act?"✓ ":parcial?"± ":"○ ")+l.nombre.slice(0,42)+(l.nombre.length>42?"…":"")));
      });
      it.appendChild(lw);
    }
    a.appendChild(it);
  });

  const n=Object.keys(d.presentes).length;
  a.appendChild(h("div",{class:"muted small",style:"margin:10px 0",
    text:`${n} persona(s) · ${etapas(d).length} etapas resultantes`}));
  a.appendChild(h("button",{class:"btn wide",disabled:n===0,onClick:()=>{step=2;render();}},
    "Siguiente · Revisar →"));
}

function pasoRevision(a,d){
  const et=etapas(d), rc=rcoCalc(d), ck=checkCalc(d);

  if(et.length>13) a.appendChild(h("div",{class:"alert bad",
    text:`Hay ${et.length} etapas y el formulario solo acepta 13. Quita o junta ${et.length-13}.`}));
  const largas=et.filter(e=>e.nombre.length>100);
  if(largas.length) a.appendChild(h("div",{class:"alert",
    text:`${largas.length} etapa(s) pasan los 100 caracteres. Se cortarán al pegar.`}));

  // --- Etapas ---
  const ce=h("div",{class:"card"});
  ce.appendChild(h("h3",{text:`Etapas de desarrollo (${et.length})`}));
  et.forEach((e,i)=>{
    const it=h("div",{class:"item"});
    it.appendChild(h("div",{class:"row"},
      h("div",{style:"font-weight:800;color:var(--acc2);min-width:22px",text:(i+1)+"."}),
      h("div",{class:"grow t",text:e.nombre,style:e.nombre.length>100?"color:var(--warn)":""}),
      h("button",{class:"btn xs ghost",onClick:()=>mover(d,e.id,-1)},"↑"),
      h("button",{class:"btn xs ghost",onClick:()=>mover(d,e.id,1)},"↓"),
      h("button",{class:"btn xs danger",onClick:()=>{
        if(e.manual) d.manuales=d.manuales.filter(m=>m.id!==e.id);
        else d.excluidas.push(e.id);
        save();render();}},"✕")));
    const pw=h("div",{class:"row wrap",style:"margin-top:7px"});
    DB.peligros.forEach(p=>{
      const on=e.peligros.includes(p.n);
      if(!on && !d._verTodosPeligros) return;
      pw.appendChild(h("button",{type:"button",class:"chip pel"+(on?" on":""),onClick:()=>{
        const cur=(d.pelOv[e.id]||e.peligros).slice();
        const k=cur.indexOf(p.n); if(k<0)cur.push(p.n); else cur.splice(k,1);
        d.pelOv[e.id]=cur; save();render();}},
        pad2(p.n)+"."+p.nombre));
    });
    pw.appendChild(h("button",{class:"btn xs ghost",onClick:()=>{d._verTodosPeligros=!d._verTodosPeligros;render();}},
      d._verTodosPeligros?"− peligros":"+ peligros"));
    it.appendChild(pw);
    ce.appendChild(it);
  });
  const na=h("div",{class:"row",style:"margin-top:8px"});
  const inp=h("input",{type:"text",placeholder:"Agregar etapa a mano..."});
  na.appendChild(h("div",{class:"grow"},inp));
  na.appendChild(h("button",{class:"btn sm",onClick:()=>{
    const v=inp.value.trim(); if(!v) return;
    d.manuales.push({id:nid("m"),nombre:v,peligros:[1,2]}); save();render();}},"+"));
  ce.appendChild(na);
  const quitadas=(d.excluidas||[]).map(lab).filter(Boolean);
  if(quitadas.length){
    ce.appendChild(h("div",{class:"muted small",style:"margin-top:9px",text:"Quitadas:"}));
    const qw=h("div",{class:"row wrap"});
    quitadas.forEach(l=>qw.appendChild(h("button",{type:"button",class:"chip",onClick:()=>{
      d.excluidas=d.excluidas.filter(x=>x!==l.id);save();render();}},"↩ "+l.nombre.slice(0,40))));
    ce.appendChild(qw);
  }
  a.appendChild(ce);

  // --- Checklist previas ---
  const cc=h("div",{class:"card"});
  cc.appendChild(h("h3",{text:"Etapas previas del trabajo"}));
  CHECKLIST.forEach(q=>{
    const cur=ck[q.i];
    const it=h("div",{class:"item"});
    it.appendChild(h("div",{class:"t",text:q.i+". "+q.corto}));
    const tri=h("div",{class:"tri",style:"margin-top:7px"});
    [["si","SÍ"],["no","NO"],["na","N/A"]].forEach(([v,l])=>{
      tri.appendChild(h("button",{class:v+(cur.v===v?" on":""),onClick:()=>{
        d.clOv[q.i]=Object.assign({},d.clOv[q.i],{v}); save();render();}},l));
    });
    it.appendChild(tri);
    const obs=h("input",{type:"text",placeholder:"Medida de control aplicada / observación",
      value:cur.obs,style:"margin-top:7px",
      onBlur:e=>{d.clOv[q.i]=Object.assign({},d.clOv[q.i],{obs:e.target.value});save();}});
    it.appendChild(obs);
    cc.appendChild(it);
  });
  a.appendChild(cc);

  // --- RCO ---
  const cr=h("div",{class:"card"});
  const activos=Object.keys(rc).filter(k=>rc[k]==="si");
  cr.appendChild(h("h3",{text:`Riesgos críticos · ${activos.length} en SÍ`}));
  for(let i=1;i<=19;i++){
    const on=rc[i]==="si";
    const it=h("div",{class:"row",style:"padding:6px 0;border-bottom:1px solid var(--line)"});
    it.appendChild(h("div",{class:"grow small",text:`N°${i} ${RCOS[i-1]}`,
      style:on?"font-weight:700":"color:var(--txt2)"}));
    const tri=h("div",{class:"tri",style:"width:110px"});
    [["si","SÍ"],["no","No"]].forEach(([v,l])=>{
      tri.appendChild(h("button",{class:v+(rc[i]===v?" on":""),
        onClick:()=>{d.rcoOv[i]=v;save();render();}},l));
    });
    it.appendChild(tri);
    cr.appendChild(it);
  }
  a.appendChild(cr);

  a.appendChild(h("button",{class:"btn wide",onClick:()=>{step=3;copiados={};render();}},
    "Generar texto para copiar →"));
}
function mover(d,id,dir){
  const list=etapas(d).map(e=>e.id);
  const i=list.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  list.splice(j,0,list.splice(i,1)[0]);
  d.orden=list; save(); render();
}

function pasoSalida(a,d){
  const cs=campos(d);
  const tabs=h("div",{class:"row",style:"margin-bottom:8px"});
  tabs.appendChild(h("button",{class:"btn "+(d._modo!=="full"?"":"sec")+" grow",
    onClick:()=>{d._modo="campos";save();render();}},"Campo por campo"));
  tabs.appendChild(h("button",{class:"btn "+(d._modo==="full"?"":"sec")+" grow",
    onClick:()=>{d._modo="full";save();render();}},"Texto completo"));
  a.appendChild(tabs);

  if(d._modo==="full"){
    const txt=textoCompleto(d);
    a.appendChild(h("button",{class:"btn wide",onClick:()=>copy(txt)},"📋 Copiar todo"));
    a.appendChild(h("pre",{class:"full",text:txt}));
  } else {
    const hechos=Object.keys(copiados).length;
    a.appendChild(h("div",{class:"muted small",
      text:`${hechos} de ${cs.filter(c=>!c.nocopy).length} campos copiados. Se marcan en verde al copiarlos.`}));
    let sec=null;
    cs.forEach((c,i)=>{
      if(c.sec!==sec){
        sec=c.sec;
        const t={previas:"ETAPAS PREVIAS DEL TRABAJO",art:"ART · ETAPAS DE DESARROLLO",
                 rco:"RIESGOS CRÍTICOS (marcar Sí/No)",firmas:"FIRMANTES"}[sec];
        if(t) a.appendChild(h("div",{style:"margin:16px 0 4px;font-weight:800;font-size:12px;letter-spacing:1px;color:var(--acc2)",text:t}));
      }
      const val=c.copiar!==undefined?c.copiar:c.v;
      const box=h("div",{class:"copybox"+(copiados[i]?" done":"")});
      const lbl=h("div",{class:"lbl"}, h("div",{class:"grow",text:c.l}));
      if(!c.nocopy && val) lbl.appendChild(h("button",{class:"btn xs",onClick:()=>{
        copy(val,()=>{copiados[i]=1;box.classList.add("done");});}},"Copiar"));
      if(c.max && (c.v||"").length>c.max)
        lbl.appendChild(h("span",{class:"badge",style:"border-color:var(--no);color:var(--no)",
          text:(c.v||"").length+"/"+c.max}));
      box.appendChild(lbl);
      box.appendChild(h("div",{class:"val",text:c.v||"—"}));
      a.appendChild(box);
    });
  }

  a.appendChild(h("div",{class:"hr"}));
  a.appendChild(h("button",{class:"btn sec wide",onClick:()=>{
    DB.arts.unshift({id:nid("a"),fecha:d.fecha,trabajo:d.trabajo||trabajoAuto(d),
      area:d.area,personas:Object.keys(d.presentes).length,
      draft:JSON.parse(JSON.stringify(d)),texto:textoCompleto(d)});
    DB.arts=DB.arts.slice(0,60); save(); toast("Guardado en historial"); view="hist"; render();}},
    "Guardar en historial"));
  if(navigator.share) a.appendChild(h("button",{class:"btn ghost wide",style:"margin-top:8px",
    onClick:()=>navigator.share({title:"ART "+fechaCL(d.fecha),text:textoCompleto(d)}).catch(()=>{})},
    "Compartir"));
}

/* ----- 7.2 Personal ----- */
function vPersonas(a){
  if(subview==="edit") return edPersona(a);
  a.appendChild(h("div",{class:"muted small",
    text:"Cada persona tiene labores principales (siempre) y parciales (a veces). De ahí salen los riesgos."}));
  DB.personas.forEach(p=>{
    const it=h("div",{class:"item",style:p.activo?"":"opacity:.45"});
    it.appendChild(h("div",{class:"row"},
      h("div",{class:"grow"},
        h("div",{class:"t",text:p.nombre}),
        h("div",{class:"s",text:p.cargo+" · "+p.rut})),
      h("button",{class:"btn xs sec",onClick:()=>{editId=p.id;subview="edit";render();}},"Editar")));
    const bw=h("div",{style:"margin-top:6px"});
    p.principales.forEach(id=>{const l=lab(id); if(l) bw.appendChild(h("span",{class:"badge acc",text:l.nombre.slice(0,30)}));});
    p.parciales.forEach(id=>{const l=lab(id); if(l) bw.appendChild(h("span",{class:"badge",text:"± "+l.nombre.slice(0,28)}));});
    it.appendChild(bw);
    a.appendChild(it);
  });
  a.appendChild(h("button",{class:"btn wide",style:"margin-top:12px",
    onClick:()=>{const p={id:nid("p"),rut:"",nombre:"",cargo:"",principales:[],parciales:[],activo:true};
      DB.personas.push(p);editId=p.id;subview="edit";save();render();}},"+ Agregar persona"));
}
function edPersona(a){
  const p=per(editId); if(!p){subview=null;return render();}
  const c=h("div",{class:"card"});
  c.appendChild(h("label",{class:"f",text:"Nombre completo"}));
  c.appendChild(h("input",{type:"text",value:p.nombre,onBlur:e=>{p.nombre=e.target.value;save();}}));
  c.appendChild(h("label",{class:"f",text:"RUT"}));
  c.appendChild(h("input",{type:"text",value:p.rut,onBlur:e=>{p.rut=e.target.value;save();}}));
  c.appendChild(h("label",{class:"f",text:"Cargo"}));
  c.appendChild(h("input",{type:"text",value:p.cargo,onBlur:e=>{
    p.cargo=e.target.value;
    if(!p.principales.length){
      const t=p.cargo.toLowerCase();
      Object.keys(CARGO_LABORES).forEach(k=>{ if(t.includes(k)) p.principales=CARGO_LABORES[k].slice(); });
    }
    save();render();}}));
  c.appendChild(h("label",{class:"f",text:"Labores principales (siempre las hace)"}));
  const w1=h("div",{class:"row wrap"});
  DB.labores.filter(l=>!l.base).forEach(l=>w1.appendChild(h("div",
    {class:"chip"+(p.principales.includes(l.id)?" on":""),onClick:()=>{
      const i=p.principales.indexOf(l.id); if(i<0)p.principales.push(l.id); else p.principales.splice(i,1);
      save();render();}}, l.nombre.slice(0,38))));
  c.appendChild(w1);
  c.appendChild(h("label",{class:"f",text:"Labores parciales (a veces / apoya)"}));
  const w2=h("div",{class:"row wrap"});
  DB.labores.filter(l=>!l.base).forEach(l=>w2.appendChild(h("div",
    {class:"chip"+(p.parciales.includes(l.id)?" part":""),onClick:()=>{
      const i=p.parciales.indexOf(l.id); if(i<0)p.parciales.push(l.id); else p.parciales.splice(i,1);
      save();render();}}, l.nombre.slice(0,38))));
  c.appendChild(w2);
  c.appendChild(h("div",{class:"row",style:"margin-top:12px"},
    h("button",{class:"btn sec grow",onClick:()=>{p.activo=!p.activo;save();render();}},
      p.activo?"Marcar inactivo":"Reactivar"),
    h("button",{class:"btn danger grow",onClick:()=>{
      if(confirm("¿Borrar a "+p.nombre+"?")){DB.personas=DB.personas.filter(x=>x.id!==p.id);
        subview=null;save();render();}}},"Borrar")));
  a.appendChild(c);
}

/* ----- 7.3 Labores ----- */
function vLabores(a){
  if(subview==="edit") return edLabor(a);
  a.appendChild(h("div",{class:"muted small",
    text:"Una labor = una etapa del ART. Las marcadas BASE siempre entran (ingreso, traslado, aseo, retiro)."}));
  DB.labores.slice().sort((x,y)=>(x.orden||50)-(y.orden||50)).forEach(l=>{
    const it=h("div",{class:"item"});
    it.appendChild(h("div",{class:"row"},
      h("div",{class:"grow"},
        h("div",{class:"t",text:l.nombre}),
        h("div",{class:"s",text:(l.base?"BASE · ":"")+"orden "+(l.orden||50)+" · "+(l.peligros||[]).length+" peligros"})),
      h("button",{class:"btn xs sec",onClick:()=>{editId=l.id;subview="edit";render();}},"Editar")));
    const bw=h("div",{style:"margin-top:6px"});
    (l.peligros||[]).forEach(n=>{const p=pel(n); if(p) bw.appendChild(h("span",{class:"badge",text:pad2(n)+"."+p.nombre}));});
    it.appendChild(bw);
    a.appendChild(it);
  });
  a.appendChild(h("button",{class:"btn wide",style:"margin-top:12px",onClick:()=>{
    const l={id:nid("l"),nombre:"",orden:50,peligros:[1,2],check:{}};
    DB.labores.push(l);editId=l.id;subview="edit";save();render();}},"+ Agregar labor"));
}
function edLabor(a){
  const l=lab(editId); if(!l){subview=null;return render();}
  const c=h("div",{class:"card"});
  c.appendChild(h("label",{class:"f",text:"Nombre de la etapa (así se pega en Foco, máx 100)"}));
  const ta=h("textarea",{onBlur:e=>{l.nombre=e.target.value;save();render();}});
  ta.value=l.nombre; c.appendChild(ta);
  c.appendChild(h("div",{class:"count"+(l.nombre.length>100?" over":""),text:l.nombre.length+"/100"}));

  c.appendChild(h("label",{class:"f",text:"Orden en el ART"}));
  c.appendChild(h("input",{type:"text",value:l.orden||50,onBlur:e=>{l.orden=parseInt(e.target.value)||50;save();}}));

  c.appendChild(h("div",{class:"row",style:"margin-top:10px"},
    h("button",{type:"button",class:"chip"+(l.base?" on":""),onClick:()=>{l.base=!l.base;save();render();}},
      "Etapa base (siempre presente)")));

  c.appendChild(h("label",{class:"f",text:"Peligros asociados"}));
  const w=h("div",{class:"row wrap"});
  DB.peligros.forEach(p=>w.appendChild(h("button",{type:"button",class:"chip pel"+((l.peligros||[]).includes(p.n)?" on":""),
    onClick:()=>{l.peligros=l.peligros||[]; const i=l.peligros.indexOf(p.n);
      if(i<0)l.peligros.push(p.n); else l.peligros.splice(i,1);
      l.peligros.sort((x,y)=>x-y); save();render();}}, pad2(p.n)+"."+p.nombre)));
  c.appendChild(w);

  c.appendChild(h("label",{class:"f",text:"Respuestas que fuerza en el checklist previo"}));
  CHECKLIST.forEach(q=>{
    const cur=(l.check||{})[q.i];
    const r=h("div",{class:"row",style:"padding:4px 0"});
    r.appendChild(h("div",{class:"grow small",text:q.i+". "+q.corto,
      style:cur?"":"color:var(--txt2)"}));
    const tri=h("div",{class:"tri",style:"width:150px"});
    [["si","SÍ"],["no","NO"],["na","N/A"],["","—"]].forEach(([v,t])=>{
      tri.appendChild(h("button",{class:(v||"na")+((cur||"")===v?" on":""),onClick:()=>{
        l.check=l.check||{}; if(v) l.check[q.i]=v; else delete l.check[q.i];
        save();render();}},t));
    });
    r.appendChild(tri);
    c.appendChild(r);
    if(cur) c.appendChild(h("input",{type:"text",style:"margin:0 0 8px",
      placeholder:"Observación / medida que aporta esta labor",
      value:(l.checkObs||{})[q.i]||"",
      onBlur:e=>{ l.checkObs=l.checkObs||{};
        if(e.target.value.trim()) l.checkObs[q.i]=e.target.value.trim(); else delete l.checkObs[q.i];
        save(); }}));
  });

  c.appendChild(h("button",{class:"btn danger wide",style:"margin-top:12px",onClick:()=>{
    if(confirm("¿Borrar la labor?")){DB.labores=DB.labores.filter(x=>x.id!==l.id);
      DB.personas.forEach(p=>{p.principales=p.principales.filter(i=>i!==l.id);
        p.parciales=p.parciales.filter(i=>i!==l.id);});
      subview=null;save();render();}}},"Borrar labor"));
  a.appendChild(c);
}

/* ----- 7.4 Peligros ----- */
function vPeligros(a){
  if(subview==="edit") return edPeligro(a);
  a.appendChild(h("div",{class:"muted small",
    text:"Catálogo numerado igual que Foco Prevención. Cada peligro trae sus medidas de control estándar."}));
  DB.peligros.slice().sort((x,y)=>x.n-y.n).forEach(p=>{
    const it=h("div",{class:"item"});
    it.appendChild(h("div",{class:"row"},
      h("div",{class:"grow t",text:pad2(p.n)+". "+p.nombre}),
      h("button",{class:"btn xs sec",onClick:()=>{editId=p.n;subview="edit";render();}},"Editar")));
    it.appendChild(h("div",{class:"s",text:p.medidas.length+" medidas de control"}));
    a.appendChild(it);
  });
  a.appendChild(h("button",{class:"btn wide",style:"margin-top:12px",onClick:()=>{
    const n=parseInt(prompt("Número del peligro en Foco (ej: 5, 19, 26):")||"0");
    if(!n||pel(n)) return toast("Número inválido o ya existe");
    DB.peligros.push({n,nombre:"",medidas:[]});editId=n;subview="edit";save();render();}},
    "+ Agregar peligro"));
  a.appendChild(h("div",{class:"hr"}));
  a.appendChild(h("button",{class:"btn ghost wide",onClick:exportar},"Exportar respaldo (JSON)"));
  a.appendChild(h("button",{class:"btn ghost wide",style:"margin-top:8px",onClick:importar},"Importar respaldo"));
}
function edPeligro(a){
  const p=pel(editId); if(!p){subview=null;return render();}
  const c=h("div",{class:"card"});
  c.appendChild(h("label",{class:"f",text:"N° en Foco"}));
  c.appendChild(h("input",{type:"text",value:p.n,onBlur:e=>{
    const v=parseInt(e.target.value); if(v&&!pel(v)){ p.n=v; editId=v; save(); } render();}}));
  c.appendChild(h("label",{class:"f",text:"Nombre del peligro"}));
  c.appendChild(h("input",{type:"text",value:p.nombre,onBlur:e=>{p.nombre=e.target.value;save();}}));
  c.appendChild(h("label",{class:"f",text:"Medidas de control (una por línea)"}));
  const ta=h("textarea",{style:"min-height:180px",
    onBlur:e=>{p.medidas=e.target.value.split("\n").map(s=>s.trim()).filter(Boolean);save();render();}});
  ta.value=p.medidas.join("\n"); c.appendChild(ta);
  c.appendChild(h("div",{class:"muted small",style:"margin-top:8px",
    text:"Se pegan como: "+pad2(p.n)+".Medida 1,"+pad2(p.n)+".Medida 2"}));
  c.appendChild(h("button",{class:"btn danger wide",style:"margin-top:12px",onClick:()=>{
    if(confirm("¿Borrar peligro?")){DB.peligros=DB.peligros.filter(x=>x.n!==p.n);
      DB.labores.forEach(l=>l.peligros=(l.peligros||[]).filter(n=>n!==p.n));
      subview=null;save();render();}}},"Borrar peligro"));
  a.appendChild(c);
}

/* ----- 7.5 Historial ----- */
function vHist(a){
  if(!DB.arts.length) return a.appendChild(h("div",{class:"empty",
    text:"Sin ART guardados todavía. Genera uno y toca «Guardar en historial»."}));
  DB.arts.forEach(r=>{
    const it=h("div",{class:"item"});
    it.appendChild(h("div",{class:"t",text:fechaCL(r.fecha)+" · "+(r.trabajo||"(sin título)")}));
    it.appendChild(h("div",{class:"s",text:(r.area||"")+" · "+r.personas+" personas"}));
    it.appendChild(h("div",{class:"row",style:"margin-top:8px"},
      h("button",{class:"btn xs sec grow",onClick:()=>copy(r.texto)},"Copiar texto"),
      h("button",{class:"btn xs sec grow",onClick:()=>{
        DB.draft=JSON.parse(JSON.stringify(r.draft)); DB.draft.fecha=hoy();
        copiados={}; view="art"; step=0; save(); render(); toast("Cargado como borrador");}},"Reusar"),
      h("button",{class:"btn xs danger",onClick:()=>{
        DB.arts=DB.arts.filter(x=>x.id!==r.id);save();render();}},"✕")));
    a.appendChild(it);
  });
}

/* ---------- 8. RESPALDO ---------- */
function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="art_respaldo_"+hoy()+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importar(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ DB=Object.assign(defaults(),JSON.parse(r.result)); save(); render();
      toast("Respaldo importado"); }catch(e){ toast("Archivo inválido"); } };
    r.readAsText(f); };
  i.click();
}

load();
document.body.dataset.theme = DB.theme||"dark";
D(); save();
render();
if("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(()=>{});
